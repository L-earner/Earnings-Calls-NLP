name: Temporary yfinance ETF shares test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-yfinance-etf-shares:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet yfinance pandas
      - name: Test Yahoo shares-outstanding symbols ticker by ticker
        shell: bash
        run: |
          cat > /tmp/test_etf_so_symbols.py <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          GROUPS = {
              "US Equity - Broad": ["SPY", "QQQ", "IWM", "DIA", "VTI", "MDY", "IJR", "RSP", "IVW", "IVE"],
              "US Equity - Style": ["VTV", "VUG", "MTUM", "QUAL", "VLUE", "USMV", "DVY", "SDY", "VIG", "SCHD"],
              "US Sectors": ["XLB", "XLC", "XLE", "XLF", "XLI", "XLK", "XLP", "XLU", "XLV", "XLY", "XLRE", "VNQ", "IYR"],
              "International Developed": ["EFA", "VEA", "VGK", "IEFA", "ACWI", "ACWX", "EWJ", "EWG", "EWU", "EWT", "EWH", "EWQ", "EWL", "EWN", "EWI", "EWP", "EWC", "EWA"],
              "Emerging Markets": ["EEM", "VWO", "IEMG", "FXI", "MCHI", "EWZ", "EWY", "EWW", "INDA", "EZA", "THD"],
              "Fixed Income": ["AGG", "BND", "BNDX", "TLT", "IEF", "SHY", "GOVT", "BIL", "LQD", "VCSH", "HYG", "JNK", "TIP", "EMB", "MUB"],
              "Commodities": ["GLD", "IAU", "SLV", "PPLT", "USO", "UNG", "DBC", "GSG", "DBA"],
              "Specialty": ["IBB", "XBI", "SMH", "SOXX", "KRE", "XME", "OIH", "XRT", "ITB", "ITA"],
              "Currency": ["UUP", "FXE", "FXY", "FXB"],
          }
          OUT = Path("yfinance_etf_so_symbol_results")
          OUT.mkdir(exist_ok=True)
          rows = []
          raw = []

          for group, tickers in GROUPS.items():
              for ticker in tickers:
                  yahoo_symbol = f"^{ticker}-SO"
                  error = ""
                  df = pd.DataFrame()
                  for attempt in range(1, 4):
                      try:
                          df = yf.download(yahoo_symbol, start="2024-01-01", progress=False, auto_adjust=False, threads=False, timeout=20)
                          break
                      except Exception as exc:
                          error = f"{type(exc).__name__}: {exc}"
                          if attempt < 3:
                              time.sleep(2 ** attempt)
                  if df is None or df.empty:
                      rows.append({"ticker":ticker,"yahoo_symbol":yahoo_symbol,"group":group,"status":"none","observations":0,"first_date":"","last_date":"","latest_value":"","unique_values":0,"change_events":0,"error":error})
                      print(f"{ticker:5s} {yahoo_symbol:12s} NONE {error}", flush=True)
                      time.sleep(0.6)
                      continue
                  if isinstance(df.columns, pd.MultiIndex):
                      close = df["Close"].iloc[:, 0]
                  else:
                      close = df["Close"]
                  close = pd.to_numeric(close, errors="coerce").dropna()
                  if close.empty:
                      rows.append({"ticker":ticker,"yahoo_symbol":yahoo_symbol,"group":group,"status":"none","observations":0,"first_date":"","last_date":"","latest_value":"","unique_values":0,"change_events":0,"error":error})
                      print(f"{ticker:5s} {yahoo_symbol:12s} NONE", flush=True)
                      time.sleep(0.6)
                      continue
                  unique_values = int(close.nunique())
                  change_events = max(int(close.diff().ne(0).sum() - 1), 0)
                  status = "usable" if len(close) >= 200 and change_events >= 20 else "limited"
                  rows.append({"ticker":ticker,"yahoo_symbol":yahoo_symbol,"group":group,"status":status,"observations":int(len(close)),"first_date":str(close.index.min().date()),"last_date":str(close.index.max().date()),"latest_value":float(close.iloc[-1]),"unique_values":unique_values,"change_events":change_events,"error":error})
                  temp = close.rename("shares_outstanding_value").reset_index()
                  temp["ticker"] = ticker
                  temp["yahoo_symbol"] = yahoo_symbol
                  raw.append(temp)
                  print(f"{ticker:5s} {yahoo_symbol:12s} {status:7s} obs={len(close):4d} changes={change_events:4d}", flush=True)
                  time.sleep(0.6)

          results = pd.DataFrame(rows).sort_values(["status","group","ticker"])
          results.to_csv(OUT / "ticker_availability.csv", index=False)
          if raw:
              pd.concat(raw, ignore_index=True).to_csv(OUT / "raw_observations.csv", index=False)
          summary = {"yfinance_version":yf.__version__,"tickers_tested":int(len(results)),"status_counts":{str(k):int(v) for k,v in results["status"].value_counts().to_dict().items()},"tickers_by_status":{status:results.loc[results["status"]==status,"ticker"].tolist() for status in sorted(results["status"].unique())}}
          (OUT / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print("\nSUMMARY\n" + json.dumps(summary, indent=2))
          PY
          python /tmp/test_etf_so_symbols.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-etf-so-symbol-results
          path: yfinance_etf_so_symbol_results/
          retention-days: 1
