name: Temporary yfinance ETF shares test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-yfinance-etf-shares:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet yfinance pandas
      - name: Test ETF shares outstanding ticker by ticker
        shell: bash
        run: |
          cat > /tmp/test_etf_shares.py <<'PY'
          from __future__ import annotations
          import json, time
          from datetime import date, timedelta
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          GROUPS = {
              "US Equity - Broad": ["SPY", "QQQ", "IWM", "DIA", "VTI", "MDY", "IJR", "RSP", "IVW", "IVE"],
              "US Equity - Style": ["VTV", "VUG", "MTUM", "QUAL", "VLUE", "USMV", "DVY", "SDY", "VIG", "SCHD"],
              "US Sectors": ["XLB", "XLC", "XLE", "XLF", "XLI", "XLK", "XLP", "XLU", "XLV", "XLY", "XLRE", "VNQ", "IYR"],
              "International Developed": ["EFA", "VEA", "VGK", "IEFA", "ACWI", "ACWX", "EWJ", "EWG", "EWU", "EWT", "EWH", "EWQ", "EWL", "EWN", "EWI", "EWP", "EWC", "EWA"],
              "Emerging Markets": ["EEM", "VWO", "IEMG", "FXI", "MCHI", "EWZ", "EWY", "EWW", "INDA", "EZA", "THD"],
              "Fixed Income": ["AGG", "BND", "BNDX", "TLT", "IEF", "SHY", "GOVT", "BIL", "LQD", "VCSH", "HYG", "JNK", "TIP", "EMB", "MUB"],
              "Commodities": ["GLD", "IAU", "SLV", "PPLT", "USO", "UNG", "DBC", "GSG", "DBA"],
              "Specialty": ["IBB", "XBI", "SMH", "SOXX", "KRE", "XME", "OIH", "XRT", "ITB", "ITA"],
              "Currency": ["UUP", "FXE", "FXY", "FXB"],
          }
          START = "2024-01-01"
          END = (date.today() + timedelta(days=1)).isoformat()
          OUT = Path("yfinance_etf_shares_results")
          OUT.mkdir(exist_ok=True)
          rows = []
          raw_frames = []

          for group, tickers in GROUPS.items():
              for ticker in tickers:
                  error = ""
                  series = None
                  attempts = 0
                  for attempt in range(1, 4):
                      attempts = attempt
                      try:
                          series = yf.Ticker(ticker).get_shares_full(start=START, end=END)
                          break
                      except Exception as exc:
                          error = f"{type(exc).__name__}: {exc}"
                          if attempt < 3:
                              time.sleep(2 ** attempt)
                  if isinstance(series, pd.DataFrame):
                      series = series.iloc[:, 0] if series.shape[1] == 1 else None
                  if series is not None:
                      series = pd.to_numeric(series, errors="coerce").dropna()
                  if series is None or series.empty:
                      rows.append({"ticker":ticker,"group":group,"status":"none" if not error else "error","observations":0,"unique_dates":0,"duplicate_date_rows":0,"conflicting_duplicate_dates":0,"unique_share_values":0,"share_change_events":0,"first_date":"","last_date":"","latest_shares":"","median_gap_days":"","attempts":attempts,"error":error})
                      print(f"{ticker:5s} NONE {error}", flush=True)
                      time.sleep(0.8)
                      continue
                  frame = pd.DataFrame({"timestamp":pd.to_datetime(series.index, utc=True),"shares_outstanding":series.to_numpy()})
                  frame["date"] = frame["timestamp"].dt.date
                  frame["ticker"] = ticker
                  frame["group"] = group
                  frame = frame.sort_values(["timestamp","shares_outstanding"])
                  date_counts = frame.groupby("date").size()
                  duplicate_date_rows = int((date_counts - 1).clip(lower=0).sum())
                  conflicting_duplicate_dates = int(frame.groupby("date")["shares_outstanding"].nunique().gt(1).sum())
                  daily = frame.sort_values("timestamp").groupby("date", as_index=False).tail(1).sort_values("date")
                  gaps = pd.to_datetime(daily["date"]).diff().dt.days.dropna()
                  unique_share_values = int(daily["shares_outstanding"].nunique())
                  share_change_events = max(int(daily["shares_outstanding"].diff().ne(0).sum() - 1), 0)
                  if len(daily) >= 200 and unique_share_values >= 20 and share_change_events >= 20:
                      status = "usable_daily"
                  elif len(daily) >= 20 and unique_share_values >= 5 and share_change_events >= 5:
                      status = "available_sparse"
                  else:
                      status = "limited"
                  rows.append({"ticker":ticker,"group":group,"status":status,"observations":int(len(frame)),"unique_dates":int(len(daily)),"duplicate_date_rows":duplicate_date_rows,"conflicting_duplicate_dates":conflicting_duplicate_dates,"unique_share_values":unique_share_values,"share_change_events":share_change_events,"first_date":str(daily["date"].iloc[0]),"last_date":str(daily["date"].iloc[-1]),"latest_shares":float(daily["shares_outstanding"].iloc[-1]),"median_gap_days":float(gaps.median()) if not gaps.empty else None,"attempts":attempts,"error":error})
                  raw_frames.append(frame[["ticker","group","timestamp","date","shares_outstanding"]])
                  print(f"{ticker:5s} {status:16s} dates={len(daily):4d} changes={share_change_events:4d} dup_conflicts={conflicting_duplicate_dates:3d}", flush=True)
                  time.sleep(0.8)

          results = pd.DataFrame(rows).sort_values(["status","group","ticker"])
          results.to_csv(OUT / "ticker_availability.csv", index=False)
          if raw_frames:
              pd.concat(raw_frames, ignore_index=True).to_csv(OUT / "raw_shares_observations.csv", index=False)
          summary = {"yfinance_version":yf.__version__,"test_start":START,"test_end":END,"tickers_tested":int(len(results)),"status_counts":{str(k):int(v) for k,v in results["status"].value_counts(dropna=False).to_dict().items()},"tickers_by_status":{status:results.loc[results["status"]==status,"ticker"].tolist() for status in sorted(results["status"].unique())}}
          (OUT / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print("\nSUMMARY\n" + json.dumps(summary, indent=2))
          PY
          python /tmp/test_etf_shares.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-etf-shares-results
          path: yfinance_etf_shares_results/
          retention-days: 1
